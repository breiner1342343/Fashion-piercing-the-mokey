<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente - Fashion Piercing</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_crear.css') }}">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="brand-name">
            <h1>FASHION PIERCING</h1>
        </div>
        <nav class="con-menu">
            <ul>
                <li><a href="/admin"><i class='bx bxs-dashboard'></i> Dashboard</a></li>
                <li><a href="/crear_cliente"><i class='bx bxs-user-detail'></i> Clientes</a></li>
                <li><a href="/ventas"><i class='bx bxs-package'></i> Ventas</a></li>
                <li><a href="/reportes_ventas"><i class='bx bx-bar-chart-alt'></i> Reportes de Ventas</a></li>
                <li><a href="/crear"><i class='bx bx-add-to-queue'></i> Agregar Producto</a></li>
                <li><a href="/administradores"><i class='bx bx-add-to-queue'></i> Administradores</a></li>
                <li><a href="/"><i class='bx bx-add-to-queue'></i> Tienda Virtual</a></li>
                <li><a href="/perfil"><i class='bx bx-add-to-queue'></i> perfil</a></li>
                <li><a href="/cerrar_session"><i class='bx bx-log-in'></i> Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content" id="main-content">
        
        <header class="header">
            <div class="header-left">
                <h2 style="color: #fff; margin: 0;">Editar Cliente #{{ cliente.id }}</h2>
            </div>
        </header>

        <div class="container my-4" style="max-width: 600px; width: 90%;">

            <div class="card shadow-sm mx-auto">
                <div class="card-header">
                    <h4 class="mb-0">Actualizar Datos del Cliente</h4>
                </div>
                <div class="card-body">
                    <form action="/actualizar_cliente/{{ cliente.id }}" method="POST">
                        
                        <!-- Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Cliente</label>
                            <input type="text" name="nombre" id="nombre" class="form-control" value="{{ cliente.nombre }}" required>
                        </div>
                    
                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" name="email" id="email" class="form-control" value="{{ cliente.correo }}" required>
                        </div>
                    
                        <!-- Teléfono -->
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" name="telefono" id="telefono" class="form-control" value="{{ cliente.telefono }}" required>
                        </div>
                    
                        <!-- Botones de Acción -->
                        <div class="d-grid gap-2" style="display: flex; gap: 10px; margin-top: 20px;">
                            <button type="submit" class="btn btn-success" style="flex: 1;">Guardar Cambios</button>
                            <a href="/crear_cliente" class="btn btn-secondary" style="flex: 1; text-align: center; text-decoration: none;">Cancelar</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
