<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Fashion Piercing</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../static/css/style_admin.css">
</head>
<body>

    <!-- Control Toggle Menú Móvil -->
    <input type="checkbox" id="menu-toggle-check" class="menu-checkbox">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="brand-name">
            <h1>FASHION PIERCING</h1>
        </div>
        <nav class="con-menu">
            <ul>
                <li><a href="/admin"><i class='bx bxs-dashboard'></i> Dashboard</a></li>
                <li><a href="/crear_cliente"><i class='bx bxs-user-detail'></i> Clientes</a></li>
                <li><a href="/ventas"><i class='bx bxs-package'></i> Ventas</a></li>
                <li><a href="/reportes_ventas"><i class='bx bx-bar-chart-alt'></i> Reportes de Ventas</a></li>
                <li><a href="/crear"><i class='bx bx-add-to-queue'></i> Agregar Producto</a></li>
                <li><a href="/administradores"><i class='bx bx-add-to-queue'></i> Administradores</a></li>
                <li><a href="/"><i class='bx bx-add-to-queue'></i> Tienda Virtual</a></li>
                <li><a href="/perfil"><i class='bx bx-add-to-queue'></i> perfil</a></li>
                <li><a href="/cerrar_session"><i class='bx bx-log-in'></i> Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content" id="main-content">
        
        <!-- Header Superior -->
        <header class="header">
            <div class="header-left">
                <label for="menu-toggle-check" class="menu-toggle" id="menu-toggle">
                    <i class='bx bx-menu'></i>
                </label>
                <div class="search">
                    <input type="text" placeholder="Buscar..." id="searchInput">
                    <button type="button"><i class='bx bx-search'></i></button>  
                </div>
                
                <!-- Menú Desplegable Añadir -->
                <div class="dropdown">
                    <input type="checkbox" id="dropdown-toggle" class="dropdown-check">
                    <label for="dropdown-toggle" class="btn dropdown-btn">
                        <i class='bx bx-plus'></i> Añadir
                    </label>
                    <ul class="dropdown-menu">
                        <li><a href="#" onclick="toggleVista(true); return false;"><i class='bx bx-package'></i> Nuevo Producto</a></li>
                        <li><a href="#clientes"><i class='bx bx-user-plus'></i> Nuevo Cliente</a></li>
                        <li><a href="#reportes"><i class='bx bx-cart-add'></i> Registrar Venta</a></li>
                    </ul>
                </div>
            </div>
        </header>


</body>
</html>
