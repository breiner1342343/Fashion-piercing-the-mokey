<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Fashion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style_login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <header class="header">
        <nav class="nav">
            <div class="logo">
                <img src="../static/img/logo_fashion.png" alt="Logo Fashion Breiner" width="80px">
            </div>
            <div class="search">
                <input type="text" placeholder="Buscar..." id="searchInput">
                <button type="button"><i class='bx bx-search'></i></button>  
            </div>
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/">Nosotros</a></li>
                <li><a href="/">Productos</a></li>
                <li><a href="/">Contacto</a></li>
                <li>
                    <a href="#carrito" class="cart-icon">
                        <i class='bx bx-cart' id="icarrito"></i>
                    </a>
                </li>
            </ul>
            
            <div class="mobile-menu-btn" id="mobileMenuBtn">
                <span></span>
                <span></span>  
                <span></span>
            </div>
            
            <div class="mobile-menu" id="mobileMenu">
                <a href="/">Inicio</a>
                <a href="/">Productos</a>
                <a href="/">Nosotros</a>
                <a href="/">Contacto</a>
                <a href="/">Carrito</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <video autoplay muted id="videoFondo">
            <source src="../static/img/fondo_login.mp4" type="video/mp4">
        </video>

        <div class="formulario">
            <h1>Registro de Clientes</h1>
            <form action="/guardar_cliente" method="POST">
                <div class="datos">
                    <input type="text" name="nombre" placeholder="Nombre" required>
                    <i class='bx bx-user'></i>
                </div>
                <div class="datos">
                    <input type="email" name="correo" placeholder="Correo electrónico" required>
                    <i class='bx bx-envelope'></i>
                </div>
                <div class="datos">
                    <input type="text" name="telefono" placeholder="Teléfono">
                    <i class='bx bx-phone'></i>
                </div>
                <div class="datos">
                    <input type="password" name="contraseña" placeholder="Contraseña" required>
                    <i class='bx bx-lock-alt'></i>
                </div>
                <div class="datos">
                    <input type="password" name="confirmar_password" placeholder="Confirmar contraseña" required>
                    <i class='bx bx-lock'></i>
                </div>
                
                <button class="boton" type="submit">Guardar</button>

                <div class="registrase">
                    <p>¿Ya tienes una cuenta? <a href="/login">Inicia sesión</a></p>
                </div>
            </form>
        </div>
    </main>

    <script src="../static/js/login.js"></script>
</body>
</html>
